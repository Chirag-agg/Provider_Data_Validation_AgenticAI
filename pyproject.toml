[project]
name = "provider_data_validation"
version = "0.1.0"
description = "AI-powered Provider Data Validation System using CrewAI"
authors = [{ name = "Chirag Aggarwal", email = "ca.aggarwal2006@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1",
    "twilio>=9.2.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.2",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.3",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "httpx>=0.25.1",
    "typing-extensions>=4.8.0"
]

[project.scripts]
kickoff = "provider_data_validation.main:kickoff"
run_crew = "provider_data_validation.main:kickoff"
plot = "provider_data_validation.main:plot"
run_with_trigger = "provider_data_validation.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
