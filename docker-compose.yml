version: '3.8'

services:
  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:latest
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://provider_validation:dev_password@postgres:5432/provider_db
      - CELERY_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./mock_data:/app/mock_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - provider_network
    command: python -m uvicorn src.provider_data_validation.api:app --host 0.0.0.0 --port 8000

  # Celery Worker (optional - enable for background processing)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:latest
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://provider_validation:dev_password@postgres:5432/provider_db
      - CELERY_ENABLED=true
    depends_on:
      - redis
    networks:
      - provider_network
    command: celery -A src.provider_data_validation.celery_app worker --loglevel=info
    # Uncomment to enable worker:
    # profiles:
    #   - workers

    # Frontend (optional - for development)
  frontend:
    build:
      context: ./external_frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - provider_network
    volumes:
      - ./external_frontend/src:/app/src

  # Redis for persistence and Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - provider_network

  # PostgreSQL (optional - for persistent session storage)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=provider_validation
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=provider_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U provider_validation" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - provider_network
    # Uncomment to enable postgres:
    # profiles:
    #   - persistence

volumes:
  redis_data:
  postgres_data:


networks:
  provider_network:
    driver: bridge
